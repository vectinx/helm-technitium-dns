name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - develop

jobs:
  validate:
    name: Validate Helm chart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint .

      - name: Package chart
        if: github.event_name == 'pull_request'
        run: |
          helm package . \
            --version "0.1.0-ci.${{ github.event.pull_request.number }}"

      - name: Upload chart artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: technitium-dns-ci-${{ github.event.pull_request.number }}
          path: technitium-dns-*.tgz
          if-no-files-found: error
          retention-days: 7
